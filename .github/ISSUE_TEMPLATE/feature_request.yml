name: Feature request
description: Suggest a useful screensaver or settings improvement.
title: ""
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to change?
      description: Explain the experience and why it would help.
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Device impact
      description: List affected TV models or Android versions, if known.
