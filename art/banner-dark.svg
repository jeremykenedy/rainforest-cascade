<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"><style>@keyframes ripple{0%{transform:scale(.65);opacity:.55}}.stream{animation:fall 1.8s linear infinite}.ripple{animation:ripple 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}.second{animation-delay:-1.6s}@media (prefers-reduced-motion:reduce){.ripple,.stream{animation:none}}</style><defs><linearGradient id="bg"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient><linearGradient id="flow" x2="0" y2="1"><stop stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="800" height="200" fill="url(#bg)" rx="16"/><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><text x="36" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Rainforest Cascade</text><text x="36" y="111" fill="#a8a29e" font-size="14">Real water. A quieter view.</text><rect width="140" height="22" x="38" y="132" fill="#1a1a1a" stroke="#22c55e" stroke-width=".8" rx="11"/><text x="108" y="147" fill="#22c55e" font-size="10" font-weight="500" text-anchor="middle">No tracking or analytics</text><rect width="110" height="22" x="188" y="132" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" rx="11"/><text x="243" y="147" fill="#60a5fa" font-size="10" font-weight="500" text-anchor="middle">Offline playback</text></g><g transform="translate(574 35)"><rect width="176" height="132" fill="#12362f" rx="12"/><path fill="#36594a" d="M0 0h62l-8 27 8 18-11 28 8 22-10 37H0Z"/><path fill="#29493e" d="M110 0h66v132h-43l-7-34 5-27-15-22 5-23Z"/><path fill="url(#flow)" d="M60 0h50l6 46-8 39 13 23H48l18-33-10-28Z"/><path fill="none" stroke="#e0f2fe" stroke-dasharray="6 18" stroke-linecap="round" stroke-width="3" d="M75 4v92M92 8v89M105 22v75" class="stream"/><ellipse cx="87" cy="113" fill="#155e75" rx="67" ry="17"/><ellipse cx="87" cy="113" fill="none" stroke="#7dd3fc" stroke-width="2" class="ripple" rx="49" ry="10"/><ellipse cx="87" cy="113" fill="none" stroke="#7dd3fc" stroke-width="2" class="ripple second" rx="49" ry="10"/><path stroke="#52745a" stroke-linecap="round" stroke-width="7" d="M5 24h21M12 61h24M140 25h25M145 74h21"/></g></svg>